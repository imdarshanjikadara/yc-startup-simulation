<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold">Idea 1 · Daily digest + stale-card nudges</text>

  <!-- Email -->
  <rect x="20" y="50" width="340" height="350" rx="8" fill="#fafafa" stroke="#555"/>
  <text x="36" y="76" font-weight="bold">Email · 8:00am</text>
  <text x="36" y="98" fill="#555">Subject: 3 cards are stuck on your board</text>
  <line x1="36" y1="110" x2="344" y2="110" stroke="#bbb"/>
  <text x="36" y="134">Yesterday: 4 cards moved, 2 completed 🎉</text>
  <text x="36" y="164" font-weight="bold">Needs attention</text>
  <rect x="36" y="174" width="308" height="40" rx="4" fill="#fff" stroke="#e34948"/>
  <text x="46" y="198">Leuschke Group · In progress 21 days</text>
  <rect x="36" y="220" width="308" height="40" rx="4" fill="#fff" stroke="#e34948"/>
  <text x="46" y="244">Jacobson, Mertz · Backlog 45 days</text>
  <rect x="36" y="266" width="308" height="40" rx="4" fill="#fff" stroke="#eda100"/>
  <text x="46" y="290">Carroll, Lindgren · In progress 15 days</text>
  <rect x="36" y="330" width="170" height="36" rx="18" fill="#2a78d6"/>
  <text x="121" y="353" fill="#fff" text-anchor="middle" font-weight="bold">Open my board →</text>

  <!-- Board -->
  <path d="M370 225 L400 225" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>
  <rect x="410" y="50" width="330" height="350" rx="8" fill="#fafafa" stroke="#555"/>
  <text x="426" y="76" font-weight="bold">Board (deep-linked, stale filter on)</text>
  <text x="426" y="104" fill="#555">Backlog</text>
  <text x="534" y="104" fill="#555">In progress</text>
  <text x="642" y="104" fill="#555">Complete</text>
  <rect x="426" y="114" width="96" height="54" rx="4" fill="#fff" stroke="#e34948" stroke-width="2"/>
  <text x="432" y="134" font-size="11">Jacobson…</text>
  <text x="432" y="154" font-size="11" fill="#e34948">⏱ 45d</text>
  <rect x="534" y="114" width="96" height="54" rx="4" fill="#fff" stroke="#e34948" stroke-width="2"/>
  <text x="540" y="134" font-size="11">Leuschke…</text>
  <text x="540" y="154" font-size="11" fill="#e34948">⏱ 21d</text>
  <rect x="534" y="176" width="96" height="54" rx="4" fill="#fff" stroke="#eda100" stroke-width="2"/>
  <text x="540" y="196" font-size="11">Carroll…</text>
  <text x="540" y="216" font-size="11" fill="#b07800">⏱ 15d</text>
  <rect x="642" y="114" width="86" height="54" rx="4" fill="#fff" stroke="#bbb"/>
  <rect x="426" y="320" width="302" height="60" rx="4" fill="#fff" stroke="#bbb" stroke-dasharray="4 3"/>
  <text x="436" y="344" font-size="12">Card age badge: amber &gt; 14 days, red &gt; 21 days</text>
  <text x="436" y="364" font-size="12">Snooze / "still on track" button per card</text>
</svg>
