<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="20" y="30" font-size="16" font-weight="bold">Idea 3 · Invite-teammates loop from the board</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker></defs>

  <!-- Step 1 -->
  <rect x="20" y="56" width="225" height="280" rx="8" fill="#fafafa" stroke="#555"/>
  <text x="34" y="80" font-weight="bold">1 · Trigger</text>
  <text x="34" y="104" font-size="12" fill="#555">User assigns a card to a</text>
  <text x="34" y="120" font-size="12" fill="#555">teammate not on Shiptivity</text>
  <rect x="34" y="138" width="197" height="34" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="44" y="160" font-size="12">Owner: sam@acme-freight.com</text>
  <rect x="34" y="184" width="197" height="66" rx="4" fill="#e8f0fb" stroke="#2a78d6"/>
  <text x="44" y="206" font-size="12">Sam isn't on your board yet.</text>
  <text x="44" y="224" font-size="12">Invite them so they get</text>
  <text x="44" y="240" font-size="12">updates on this card?</text>
  <rect x="34" y="266" width="120" height="32" rx="16" fill="#2a78d6"/>
  <text x="94" y="287" fill="#fff" text-anchor="middle" font-weight="bold">Invite Sam</text>

  <path d="M250 196 L276 196" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 2 -->
  <rect x="282" y="56" width="225" height="280" rx="8" fill="#fafafa" stroke="#555"/>
  <text x="296" y="80" font-weight="bold">2 · Invite email</text>
  <text x="296" y="108" font-size="12">Tama invited you to the</text>
  <text x="296" y="124" font-size="12">"Acme Freight" board and</text>
  <text x="296" y="140" font-size="12">assigned you 1 card:</text>
  <rect x="296" y="154" width="197" height="44" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="306" y="181" font-size="12">Leuschke Group · In progress</text>
  <rect x="296" y="214" width="150" height="32" rx="16" fill="#2a78d6"/>
  <text x="371" y="235" fill="#fff" text-anchor="middle" font-weight="bold">View the card</text>
  <text x="296" y="276" font-size="11" fill="#555">One-click sign-up, lands</text>
  <text x="296" y="292" font-size="11" fill="#555">directly on the card</text>

  <path d="M512 196 L538 196" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- Step 3 -->
  <rect x="544" y="56" width="196" height="280" rx="8" fill="#fafafa" stroke="#555"/>
  <text x="558" y="80" font-weight="bold">3 · Reward</text>
  <text x="558" y="108" font-size="12">Board header nudge:</text>
  <rect x="558" y="120" width="168" height="62" rx="4" fill="#fff" stroke="#1baf7a"/>
  <text x="568" y="142" font-size="12">👥 3 of 5 teammates</text>
  <text x="568" y="160" font-size="12">joined · invite 2 more</text>
  <text x="568" y="176" font-size="12">to unlock team reports</text>
  <text x="558" y="214" font-size="11" fill="#555">New member joins →</text>
  <text x="558" y="230" font-size="11" fill="#555">creates &amp; moves cards →</text>
  <text x="558" y="246" font-size="11" fill="#555">assigns others → invites</text>
  <text x="558" y="262" font-size="11" fill="#555">(viral loop)</text>
</svg>
